name: Bug report
description: Something in rails_api_keys does not work as documented
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For **security** issues, use a [private advisory](https://github.com/rubyroidlabs/rails_api_keys/security/advisories/new) instead.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps or a small code sample (prefer a host-app snippet using the public API).
      render: ruby
    validations:
      required: true
  - type: input
    id: gem_version
    attributes:
      label: Gem version
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: rails_ruby
    attributes:
      label: Rails / Ruby versions
      placeholder: "Rails 7.2 / Ruby 3.3"
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Logs, stack traces, or related issues (optional).
